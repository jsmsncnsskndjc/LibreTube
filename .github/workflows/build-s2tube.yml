name: S2 Tube Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Restore S2 icons
        run: |
          python3 - <<'EOF'
          import base64, os
          with open('s2-assets/icons.b64') as fh:
              for line in fh:
                  line = line.strip()
                  if not line:
                      continue
                  rel, b64 = line.split('\t', 1)
                  os.makedirs(os.path.dirname(rel), exist_ok=True)
                  with open(rel, 'wb') as out:
                      out.write(base64.b64decode(b64))
          print('icons restored')
          EOF

      - name: Check Gradle
        run: ./gradlew --version

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: s2-tube-apk
          path: app/build/outputs/apk/debug/app-debug.apk
